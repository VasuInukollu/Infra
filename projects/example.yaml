# Copy this file to projects/<slug>.yaml. Do not put credentials here.
project:
  slug: example
  owner: owner@example.com
  environment: nonproduction

email:
  # Transactional applications submit through https://resend.inukollu.in.
  # Never put the bearer key or shared Azure SMTP credential in this file.
  gateway:
    enabled: true
    project_id: example-nonproduction
    endpoint: https://resend.inukollu.in/v1/emails
    credential_status: not-provisioned
  # This is the project's outbound identity, not the gateway or Listmonk URL.
  sending_domain: mail.example.com
  allowed_senders:
    - notifications@mail.example.com
  # Applications may register these identities through POST /v1/senders after
  # the operator verifies and links the domain in Azure. Domain verification is
  # always an operator responsibility.
  requested_senders:
    - email: notifications@mail.example.com
      display_name: Example Notifications
      status: requested
  allowed_recipient_domains:
    - example.com
  traffic:
    transactional: true
    marketing: false
  limits:
    messages_per_second: 1
    messages_per_day: 100
  alerts:
    bounce_rate_percent: 2
    complaint_rate_percent: 0.1
    quota_usage_percent: 80
  list_management:
    enabled: false
    lists: []

data:
  classification: internal
  retention_notes: "Define before production onboarding."
